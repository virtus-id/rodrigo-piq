titulo: "Consentimento para o tratamento dos seus dados"
corpo: |
  Para montar o seu plano de quitação de dívidas, vamos te fazer perguntas sobre a sua situação financeira: dívidas, renda, contracheque, patrimônio, e se há negativação ou cobrança judicial em seu nome. São dados sensíveis por natureza, e só pedimos o que o método precisa para calcular a estratégia de quitação mais adequada ao seu caso.

  O que fazemos com os seus dados?

  Usamos essas informações exclusivamente para calcular e revisar o seu plano. Todo plano passa pela conferência de uma pessoa da nossa equipe antes de chegar até você. Seus dados trafegam e ficam guardados de forma cifrada, em ambiente de acesso restrito, e nunca são vendidos, alugados ou compartilhados com terceiros para fins comerciais.

  Por quanto tempo guardamos?

  Enquanto a sua conta estiver ativa, e por até 5 anos após o encerramento ou a sua saída do programa — prazo que usamos para responder a eventuais obrigações legais e para retomar o seu acompanhamento, se você voltar.

  Como pedir a exclusão?

  A qualquer momento, escreva para suporte@multiplicaservidor.com.br com o assunto "EXCLUSÃO DE DADOS" seguido do seu e-mail de cadastro. Antes de excluir, confirmamos que você não está mais ativo como aluno em nenhum dos nossos programas; confirmado isso, atendemos o pedido em até 15 dias úteis, exceto pela informação que a lei exigir que guardemos por mais tempo.

  Seus direitos

  Pela Lei Geral de Proteção de Dados (Lei nº 13.709/2018), você pode, a qualquer momento e pelo mesmo contato acima: confirmar se tratamos os seus dados, corrigir informação incompleta ou desatualizada, saber com quem eventualmente compartilhamos algum dado, revogar este consentimento e pedir a exclusão dos seus dados — com as exceções que a lei permitir.

  Ao aceitar, você concorda com a coleta e o tratamento dos seus dados financeiros e pessoais nos termos acima, exclusivamente para a montagem e o acompanhamento do seu plano de quitação.
