# ---------------------------------------------------------------------------
# Critério do método — T-330 (RF-111), relato do produto 2026-10-02.
#
# O método é do caso, não da dívida: aparece uma vez, em destaque, na
# conferência. Substitui a `JUSTIFICATIVA_POSICAO` repetida em cada posição
# (texto de auditoria do motor, `engine/ordem.py::_DESCRICAO_CRITERIO`).
# Redação da equipe técnica — pendente de validação do especialista.
criterio_do_metodo:
  HIBRIDO: >-
    Primeiro, uma dívida de vitória rápida: quitável em poucos meses, sem
    aumentar de forma relevante o custo ou o prazo em relação à Avalanche.
    Depois, as demais pela maior economia de juros, com a ordem revista a
    cada dívida quitada.
  AVALANCHE: >-
    Cada dívida entra quando é a que mais economiza juros por real pago,
    entre as que restam.
  BOLA_DE_NEVE: >-
    Cada dívida entra quando é a de menor valor a quitar, entre as que
    restam; empates seguem a regra de desempate do método.


# ---------------------------------------------------------------------------
# Plano do aluno: textos de "consultoria individual" (2026-10-03).
#
# Revisão pedida pelo usuário: o documento precisa parecer feito para a
# pessoa, dividido em seções fáceis de ver, com texto mais detalhado e sem
# marcas de texto gerado (travessão, emoji, exclamação de efeito, frase de
# motivação vazia). O especialista revisa o português: frases curtas, uma
# ideia por frase, vocabulário do dia a dia.
#
# Toda redação vive AQUI (AC-37) e é lida por `report/plano.py`. Textos de
# orientação (como pagar a mais, perguntas frequentes) são SUGESTÃO, ainda
# não validados pelo especialista do método: podem mudar sem mudar código.
#
# Placeholders `{...}` recebem valores já formatados pelo servidor. Nenhum
# número é calculado a partir destes textos.

# Cabeçalho personalizado. `{nome}` é o primeiro nome do aluno, vindo da
# compra (Hotmart, migração 009); sem nome, usa a versão sem nome.
cabecalho:
  preparado_para: "Plano preparado para {nome}"
  preparado_sem_nome: "Plano preparado para você"

explicacao_mes_1: >-
  Os meses do plano são contados a partir de quando você começa a segui-lo.
  O Mês 1 é o primeiro mês em que você faz o que está descrito aqui, e não
  um mês específico do calendário.

# Títulos das seções do documento, na ordem em que aparecem.
secoes:
  resumo: "Seu plano em números"
  ponto_de_partida: "Seu ponto de partida"
  primeiro_passo: "O que fazer no Mês 1"
  primeira_vitoria: "Sua primeira dívida quitada"
  como_funciona: "Como o seu plano funciona"
  jornada: "Seu plano, mês a mês"
  linha_do_tempo: "Quando cada dívida termina"
  dividas: "Suas dívidas, uma a uma"
  reserva: "Sua reserva"
  pendencias: "O que falta informar"
  duvidas: "Perguntas frequentes"
  checklist: "Seu checklist do Mês 1"
  sobre: "Sobre este plano"

# Resumo do topo. `*_rotulo` vai embaixo do número; `*_explicacao`, em
# letra menor, diz o que o número significa.
resumo:
  prazo_rotulo: "para quitar todas as dívidas do plano"
  prazo_explicacao: >-
    É o tempo até a última dívida acabar, seguindo o plano todos os meses.
  valor_mensal_rotulo: "a mais todo mês, além das parcelas"
  valor_mensal_explicacao: >-
    É o valor que você separa todo mês, além das parcelas que já paga, para
    quitar as dívidas mais rápido.
  custo_futuro_rotulo: "é o total que você ainda vai pagar"
  custo_futuro_explicacao: >-
    Soma de todas as parcelas e de todos os juros, do Mês 1 até a última
    dívida ser quitada.

# "Seu ponto de partida": os números do mês do aluno, lidos do cálculo.
ponto_de_partida:
  introducao: >-
    Estes são os números do seu mês, de acordo com as suas respostas. Eles
    são a base de tudo o que vem a seguir.
  renda: "Sua renda no mês"
  gastos: "Seus gastos do dia a dia"
  gastos_ocasionais: "Gastos que não acontecem todo mês, em média mensal"
  parcelas: "Parcelas de dívidas que você já paga"
  quantidade_dividas: "Dívidas incluídas neste plano"
  valor_extra: "Valor extra para quitar as dívidas"
  nota_seguranca: >-
    O valor extra foi calculado com uma margem de segurança e nunca passa do
    valor que você disse que consegue separar. Assim, você paga as dívidas
    sem deixar faltar dinheiro para o essencial.

# "O que fazer no Mês 1": três passos, um por cartão. `{valor}` é o extra
# do Mês 1; `{alvo}`, o nome da dívida da vez. Sugestão, a validar.
primeiro_passo:
  titulo: "O que fazer no Mês 1"
  introducao: "Neste primeiro mês, você faz três coisas, nesta ordem."
  passo_1_titulo: "Pague as parcelas de sempre"
  passo_1_texto: >-
    Continue pagando a parcela de cada dívida, como já faz hoje. Nenhuma
    delas pode atrasar.
  passo_2_titulo: "Coloque o valor extra em uma dívida só"
  passo_2_texto: >-
    Depois das parcelas, use {valor} para abater {alvo}. Não divida esse
    valor entre as dívidas: ele vai inteiro para esta.
  passo_3_titulo: "Guarde o comprovante"
  passo_3_texto: >-
    Guarde o comprovante do pagamento extra. Ele mostra que o valor foi
    abatido e ajuda se for preciso conferir depois.
  como_pagar_titulo: "Como fazer o pagamento extra"
  como_pagar_a_mais: >-
    Peça ao credor para abater esse valor direto do saldo da dívida, como
    amortização ou quitação antecipada, e não para adiantar uma parcela.
    Confira no comprovante se o saldo diminuiu.
  # Chaves anteriores, mantidas para chamadores que ainda as usam.
  instrucao_parcelas: "Pague normalmente as parcelas de todas as suas dívidas."
  instrucao_ataque: "Depois, coloque {valor} a mais em {alvo}."

primeira_vitoria:
  titulo: "Sua primeira dívida quitada"
  texto: "No Mês {mes}, a dívida {divida} estará quitada."
  complemento: >-
    A partir daí, a parcela que você pagava nela passa a ajudar a quitar a
    próxima dívida. É o primeiro sinal de que o plano está funcionando.

# "Como o seu plano funciona": três quadros. `como_funciona_rotulos` são os
# títulos curtos dos quadros; a lista por método é o texto de cada um.
como_funciona_rotulos:
  - "Uma dívida de cada vez"
  - "A dívida acaba"
  - "O valor extra cresce"
como_funciona:
  titulo: "Como o seu plano funciona"
  HIBRIDO:
    - >-
      Todo o valor extra vai primeiro para uma dívida que pode ser quitada
      logo. As outras recebem só a parcela de sempre.
    - "Quando essa dívida acaba, a parcela que você pagava nela fica livre."
    - >-
      Essa parcela se junta ao valor extra, que fica maior e passa para a
      próxima dívida. Assim, cada dívida acaba mais rápido que a anterior.
  AVALANCHE:
    - >-
      Todo o valor extra vai para a dívida que mais cobra juros. As outras
      recebem só a parcela de sempre.
    - "Quando essa dívida acaba, a parcela que você pagava nela fica livre."
    - >-
      Essa parcela se junta ao valor extra, que fica maior e passa para a
      próxima dívida. Assim, cada dívida acaba mais rápido que a anterior.
  BOLA_DE_NEVE:
    - >-
      Todo o valor extra vai para a menor dívida. As outras recebem só a
      parcela de sempre.
    - "Quando essa dívida acaba, a parcela que você pagava nela fica livre."
    - >-
      Essa parcela se junta ao valor extra, que fica maior e passa para a
      próxima dívida. Assim, cada dívida acaba mais rápido que a anterior.

# Modelos de frase por etapa (`report/plano.py::montar_jornada`). Não são
# mais exibidos como lista no documento (a grade por mês os substituiu),
# mas seguem no contrato da API.
jornada:
  titulo: "Seu plano, mês a mês"
  fase_um_mes: "Mês {mes_inicio}: {valor} a mais em {alvo}."
  fase_varios_meses: "Do Mês {mes_inicio} ao Mês {mes_fim}: {valor} a mais em {alvo}, todo mês."
  quitacao: "Mês {mes_fim}: {divida} quitada."
  quitacao_com_reforco: >-
    A parcela de {parcela} que você pagava nela passa a ajudar a quitar
    {destino}.
  quitacao_com_sobra: "Os {sobra} que restarem neste mês já vão para {destino}."
  aporte: "Mês {mes_fim}: entra o dinheiro extra que você informou, e {valor} vão para {alvo}."
  chegada: "Mês {mes_fim}: todas as dívidas do plano quitadas."

# Grade de cartões por mês e a legenda dos símbolos.
grade_meses:
  titulo: "Seu plano, mês a mês"
  introducao: >-
    Cada quadro é um mês do plano. O símbolo mostra o que acontece naquele
    mês, e a legenda logo abaixo explica cada um.
  rotulo_mes: "Mês"
  ataque: "a mais"
  quitada: "dívida quitada"
  aporte: "dinheiro extra"
  chegada: "fim das dívidas"
  primeira_vitoria: "1ª quitação"
  legenda_ataque: "Mês de pagamento. O valor é o extra que vai para a dívida da vez."
  legenda_quitacao: "Mês em que uma dívida é quitada."
  legenda_aporte: "Mês em que entra o dinheiro extra que você informou."
  legenda_chegada: "Último mês do plano. Todas as dívidas quitadas."
  # Plano com mais de 12 meses: calendário por ano, uma linha por ano.
  introducao_anos: >-
    Cada linha é um ano do plano, com os doze meses lado a lado. Os quadros
    brancos são meses de pagamento. Os quadros coloridos marcam os meses em
    que algo muda, e a legenda logo abaixo explica cada um.
  rotulo_ano: "Ano"
  meses_do_ano: "Mês {inicio} a {fim}"
  mes_unico_do_ano: "Mês {inicio}"
  valor_do_ano: "Valor extra de cada mês: {valores}"
  separador_de_valores: ", depois "
  quitacao_do_ano: "Mês {mes}: quitação de {divida}"
  legenda_comum: >-
    Mês de pagamento. Você paga as parcelas e coloca o valor extra na dívida
    da vez.
  legenda_primeira_vitoria: "Mês da primeira dívida quitada."

linha_do_tempo:
  titulo: "Quando cada dívida termina"
  introducao: >-
    Cada barra é uma dívida. Ela começa no Mês 1 e termina no mês em que a
    dívida é quitada.
  legenda_atacando: "Dívida da vez"
  legenda_aguardando: "Aguardando a vez"
  legenda_quitada: "Mês em que termina"
  comeca_aqui: "Começa aqui"
  termina_aqui: "Termina aqui"
  rotulo_ano: "Ano"

# "Suas dívidas, uma a uma": cartão de cada dívida.
dividas:
  introducao: >-
    Esta é a ordem em que as suas dívidas serão quitadas. Para cada uma,
    explicamos por que ela está nesta posição e mostramos os números que
    usamos.
  posicao: "{indice}ª dívida a ser quitada"
  por_que: "Por que ela está nesta posição"
  numeros: "Números desta dívida"
  termina_no: "Termina no"
  termina_no_valor: "Mês {mes}"
  nao_disponivel: "não disponível"

reserva_explicacao: >-
  É a parte da sua reserva que você decidiu usar neste plano. Esse dinheiro
  ajuda a quitar as dívidas mais rápido. O restante continua guardado para
  emergências.

# Pendências: onde o aluno encontra cada dado que falta, e a pergunta do
# Bloco 5 que grava o campo (botão "Responder agora" na tela).
onde_achar:
  SALDO_DEVEDOR_ATUAL: "No aplicativo ou no extrato do credor, procure por \"saldo devedor\" ou \"saldo a pagar\"."
  VALOR_QUITACAO_HOJE: "No aplicativo do credor, procure a opção \"quitação antecipada\" ou \"liquidação\"."
  TAXA_EFETIVA_MENSAL_NORMALIZADA: "No contrato ou no aplicativo do credor, procure por \"taxa de juros mensal\"."
  CET: "No contrato, procure por \"CET\" ou \"custo efetivo total\"."
  PARCELA_CONTRATUAL: "No contrato ou no aplicativo do credor, procure o valor da parcela combinada."
  PAGAMENTO_MENSAL_EFETIVO: "No seu extrato bancário, veja quanto realmente saiu por mês para esta dívida."
  CUSTO_SEGURO: "No contrato ou na fatura, procure por \"seguro prestamista\" ou \"seguro do contrato\"."

pergunta_do_campo:
  SALDO_DEVEDOR_ATUAL: "B5.B03"
  VALOR_QUITACAO_HOJE: "B5.B05A"
  PARCELA_CONTRATUAL: "B5.C02"
  PAGAMENTO_MENSAL_EFETIVO: "B5.C06"
  TAXA_EFETIVA_MENSAL_NORMALIZADA: "B5.D01A"
  CET: "B5.D03A"
  CUSTO_SEGURO: "B5.D05A"

# Perguntas frequentes, sempre abertas no documento impresso. Alinhadas às
# regras de recálculo da spec (R-01). Sugestão, a validar.
duvidas:
  - pergunta: "Quando o meu plano muda?"
    resposta: >-
      O plano só é refeito quando algo importante acontece: uma dívida é
      quitada, a sua renda muda, surge uma dívida nova ou você recebe um
      dinheiro extra. A simples passagem dos meses não muda o plano.
  - pergunta: "O que acontece com as outras dívidas enquanto eu pago uma?"
    resposta: >-
      Você continua pagando a parcela normal de todas elas, sem atraso. Só
      o valor extra do mês vai para a dívida da vez.
  - pergunta: "E se eu não conseguir separar o valor extra em algum mês?"
    resposta: >-
      Pague ao menos as parcelas normais de todas as dívidas e avise a
      equipe. O plano pode ser ajustado à sua nova situação.
  - pergunta: "E se eu receber um dinheiro extra?"
    resposta: >-
      Avise a equipe. Dependendo do valor e de quando ele chegar, o plano é
      refeito para usar esse dinheiro na quitação das dívidas.
  - pergunta: "E se eu tiver uma dívida nova?"
    resposta: >-
      Avise a equipe o quanto antes. Uma dívida nova muda a ordem e o valor
      do plano, por isso ele precisa ser refeito.
  - pergunta: "Por que não começar pela maior dívida?"
    resposta: >-
      A ordem foi definida para que você pague o menor valor total possível
      ou quite a primeira dívida mais cedo, de acordo com o seu perfil.
      Começar pela maior dívida costuma deixar o caminho mais longo e mais
      caro.

checklist:
  introducao: "Marque cada item quando concluir."
  pagar_parcela: "Pagar a parcela de {nome}: {valor}"
  pagar_extra: "Pagar {valor} a mais em {alvo}"
  guardar: "Guardar o comprovante do pagamento extra"

sobre_este_plano: >-
  Este plano foi calculado com as informações que você nos passou. Quanto
  mais completas e corretas elas estiverem, mais preciso ele fica. Antes de
  chegar até você, ele foi conferido pela nossa equipe.

# Estabilização: explica RESULTADO_CAIXA_OBSERVADO em palavras, nunca com a
# palavra "sobra" (GAB-04). Sugestão, a validar.
estabilizacao:
  titulo: "Primeiro, equilibrar o seu mês"
  texto: >-
    Hoje, considerando o que entra e o que sai, o resultado do seu mês é de
    {valor}. Esse valor ainda não pode ser usado para quitar dívidas. Nesta
    fase, o objetivo é equilibrar as contas do mês. Quando isso acontecer,
    começa a segunda fase do plano, em que as dívidas passam a ser quitadas
    uma a uma.

# ---------------------------------------------------------------------------
# Curso de entrada (Servidor Sem Dívidas) — T-352 a T-354.
#
# Só consta aqui o que está nas legendas do curso (docs/curso-ssd/). Frases
# marcadas como SUGESTÃO, a validar pelo especialista. Sem travessão, sem
# emoji. Não há "sobra" nas frases usadas na estabilização (GAB-04).
# ---------------------------------------------------------------------------
curso_ssd:
  introducao_titulo: "O curso Servidor Sem Dívidas e o seu plano"
  introducao: >-
    Este plano é a continuação do curso Servidor Sem Dívidas. Recomendamos
    fortemente que você faça o curso: ele explica, passo a passo, o que este
    plano pede e ajuda você a manter o resultado depois de quitar as
    dívidas. Abaixo, as aulas que mais ajudam no seu caso.
  quadro_titulo: "Aulas do curso que ajudam no seu plano"
  aulas:
    5:
      titulo: "Mapeamento Parte 2"
      motivo: "Ajuda a marcar o que dá para reduzir, pausar ou eliminar nos gastos do mês."
    6:
      titulo: "Renda Extra para Servidores"
      motivo: "Mostra caminhos para ganhar mais dentro das regras do serviço público."
    9:
      titulo: "Anatomia Completa de Cada Dívida"
      motivo: "Ensina a olhar cada dívida pelos juros e pela parcela, que pesam na ordem de ataque."
    10:
      titulo: "Renegociação Estratégica"
      motivo: "Ensina a negociar com o credor: documentos, leis e propostas por escrito."
    11:
      titulo: "Troca Inteligente de Dívidas"
      motivo: "Mostra quando trocar uma dívida cara por outra menos cara compensa."
    12:
      titulo: "Métodos de Quitação"
      motivo: "Explica como pagar o mínimo em todas as dívidas e concentrar o dinheiro extra em uma de cada vez."
    19:
      titulo: "Blindagem Contra Imprevistos"
      motivo: "Ensina a montar uma reserva inicial para emergências sem recorrer a novas dívidas."
    27:
      titulo: "Foco em Manutenção"
      motivo: "Mostra como manter o controle no longo prazo, com revisão mensal e check-in semanal."
  quadro_por_cenario:
    padrao: [12, 9, 10, 11, 19, 27]
    estabilizacao: [5, 6, 19]
  melhorar_titulo: "Como melhorar o seu plano"
  melhorar_intro: >-
    Não existe um percentual de economia que sirva para todo mundo, porque
    cada pessoa tem uma realidade. Estas são orientações do curso para você
    avaliar o que faz sentido no seu caso, junto com a nossa equipe.
  melhorar:
    - texto: "Reduzir despesas: marque o que dá para reduzir, pausar ou eliminar nos gastos do mês."
      aula: "Aula 5"
    - texto: "Aumentar a renda: veja caminhos permitidos dentro e fora do serviço público, sempre fora do expediente."
      aula: "Aula 6"
    - texto: "Reduzir os juros: negocie com o credor e avalie trocar a dívida por outra menos cara."
      aula: "Aulas 10 e 11"

# Nota de incômodo que o aluno deu a cada dívida (B5.H01). O aviso só aparece
# com nota 9 ou 10 em dívida que não é a primeira.
incomodo:
  linha: "Você deu nota {nota} de incômodo a esta dívida."
  aviso: >-
    A ordem do plano segue o critério do seu método. Se esta dívida pesa muito
    para você, avise a nossa equipe.

# Plano normal com capacidade de ataque zero no mês.
sem_valor_extra: >-
  Neste mês não há valor extra para quitar dívidas além das parcelas. Pague as
  parcelas normais de todas as dívidas, em dia. Quando houver valor extra, o
  plano é refeito.
