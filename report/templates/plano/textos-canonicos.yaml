# Cenário adicional — RF-98, AC-152 (T-276, DE-02).
#
# Segunda projeção do motor, com os recursos extraordinários "prováveis" e
# "possíveis". Aparece em seção própria, abaixo do plano, e nunca altera os
# números dele. Título aprovado pelo produto (`T-289`, 2026-09-30); a
# explicação está aplicada e pendente de validação do especialista.
cenario_adicional:
  titulo: "Cenário adicional: se os valores incertos chegarem"
  explicacao: >-
    Esta projeção inclui os valores extraordinários que você marcou como
    prováveis ou possíveis. Eles não fazem parte do seu plano: só passam a
    contar quando forem efetivamente recebidos.

# ---------------------------------------------------------------------------
# Seguro prestamista — RF-82 (T-245, DE-03, `E-11`: "orientar o aluno sobre
# apólice e cancelamento").
#
# Exibida no plano em cada dívida com `SEGURO_PRESTAMISTA = SIM`. Aplicada,
# pendente de validação do especialista (`T-289`): restituição proporcional
# nunca é prometida.
orientacao_seguro_prestamista: >-
  Esta dívida tem seguro prestamista. Confira na apólice ou no certificado:
  o valor total do prêmio, a forma de cobrança (junto da parcela ou à parte)
  e se a contratação era facultativa. Se não quiser mais o seguro e o
  contrato permitir, peça o cancelamento das cobranças futuras e pergunte
  sobre a restituição proporcional do período não usado. Essa restituição
  depende das condições da apólice e não é garantida.

