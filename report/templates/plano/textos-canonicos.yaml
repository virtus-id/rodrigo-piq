  RENEGOCIACAO: "Procurar o credor para renegociar ou conter o risco desta dívida antes de atacá-la."
  TROCA: "Avaliar a troca desta dívida por uma mais barata antes de atacá-la."
  ECONOMIA: "Colocar no orçamento a economia que já foi identificada nos seus gastos."

