server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rotas do backend (as mesmas que o proxy do Vite repassa em desenvolvimento,
    # mais /saude para o keep-alive do banco). /docs e /openapi.json ficam de fora.
    location ~ ^/(api|caso|conta|revisao|operador|saude)(/|$) {
        # Resolve o nome a cada requisição: se o backend reiniciar e mudar de IP,
        # não fica 502 até reiniciar o Nginx.
        resolver 127.0.0.11 valid=10s;
        set $backend http://piq-api:8000;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Arquivos do build têm hash no nome: cache longo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer outro caminho devolve o index.html, sem cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
