    # valores inteiros 4-10 por OU de IGUAL — equivalente a ">= 4" para o
    # domínio 0-10 de PESO_EMOCIONAL, sem introduzir um nó novo (fora do
    # escopo de transcrição desta tarefa).
    condicao_exibicao:
      tipo: OU
      termos:
