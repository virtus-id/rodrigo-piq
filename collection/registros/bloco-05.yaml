# Bloco 5 — Inventário de dívidas. 58 perguntas, transcritas caractere por
# caractere da §11 da canônica (specs/piq-app-spec.md, linhas 2618-3473). T-17
# (RF-03, RF-04, RF-09, AC-04, AC-36). 55 das 58 perguntas são REP por
# DIVIDA_ID (cada dívida é uma ficha) — só B5.00, B5.00A e B5.FIM02 não são
# repetíveis (são perguntas de caso, não de ficha de dívida).
QUESTIONARIO_VERSION: "1.0.3"
perguntas:
  - ID: B5.00
    bloco: 5
    enunciado: >-
      Quantas dívidas ou operações financeiras diferentes você acredita ter
      hoje?
    tipo: NUMERO
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "___ dívida(s)", valor_interno: null}
      - {rotulo: Não sei exatamente quantas., valor_interno: DESCONHECIDA, admite_nao_sei: true}
    VARIAVEL_GRAVADA: QUANTIDADE_DIVIDAS_DECLARADA_INICIAL
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Se desconhecida, preservar essa informação; a quantidade final
      confirmada é registrada separadamente em B5.FIM.

  - ID: B5.00A
    bloco: 5
    enunciado: >-
      Para ajudar a lembrar, quais destes tipos você possui ou acredita
      possuir atualmente?
    tipo: SELECAO_MULTIPLA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: Empréstimo consignado, valor_interno: CONSIGNADO}
      - {rotulo: Empréstimo pessoal, valor_interno: PESSOAL}
      - {rotulo: Financiamento de veículo, valor_interno: FIN_VEICULO}
      - {rotulo: Financiamento imobiliário, valor_interno: FIN_IMOBILIARIO}
      - {rotulo: Cartão com saldo rotativo, valor_interno: CARTAO_ROTATIVO}
      - {rotulo: Parcelamento de fatura, valor_interno: CARTAO_PARCELADO}
      - {rotulo: Cheque especial, valor_interno: CHEQUE_ESPECIAL}
      - {rotulo: Parcelamento de compra, valor_interno: PARCELAMENTO_COMPRA}
      - {rotulo: Dívida tributária, valor_interno: TRIBUTARIA}
      - {rotulo: Dívida com familiar ou outra pessoa, valor_interno: PESSOA_FISICA}
      - {rotulo: Acordo/renegociação, valor_interno: ACORDO}
      - {rotulo: Outra, valor_interno: OUTRA}
      - {rotulo: Não tenho certeza, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: TIPOS_DIVIDA_DECLARADOS
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Cada operação cadastrada recebe SYS: DIVIDA_ID (D001, D002…), estável.
      "Não tenho certeza" é exclusiva.

  # Grupo A — Identificação (ficha REP por dívida)
  - ID: B5.A01
    bloco: 5
    enunciado: Para quem você deve nessa operação?
    tipo: TEXTO_CURTO
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes: []
    VARIAVEL_GRAVADA: CREDOR
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  - ID: B5.A02
    bloco: 5
    enunciado: Que tipo de dívida é esta?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Empréstimo consignado, valor_interno: CONSIGNADO}
      - {rotulo: Empréstimo pessoal, valor_interno: PESSOAL}
      - {rotulo: Financiamento de veículo, valor_interno: FIN_VEICULO}
      - {rotulo: Financiamento imobiliário, valor_interno: FIN_IMOBILIARIO}
      - {rotulo: Cartão de crédito — saldo rotativo, valor_interno: CARTAO_ROTATIVO}
      - {rotulo: Cartão de crédito — parcelamento de fatura, valor_interno: CARTAO_PARCELADO}
      - {rotulo: Cheque especial, valor_interno: CHEQUE_ESPECIAL}
      - {rotulo: Parcelamento de compra, valor_interno: PARCELAMENTO_COMPRA}
      - {rotulo: Dívida tributária, valor_interno: TRIBUTARIA}
      - {rotulo: Dívida com familiar ou outra pessoa, valor_interno: PESSOA_FISICA}
      - {rotulo: Acordo ou renegociação, valor_interno: ACORDO}
      - {rotulo: Outra, valor_interno: OUTRA}
    VARIAVEL_GRAVADA: TIPO_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      Define modelo da engine, exibição de B5.C07 (linhas reutilizáveis) e
      de B5.G03 (modalidades portáveis).

  # RF-90, AC-139 (parte CONSIGNADO), DE-05, canônica v1.0.2 E-09 — T-256.
  # Nome técnico a critério do plano (OQ-59); enunciado: redação proposta,
  # aprovação do produto (OQ-67). Cartão consignado/benefício NÃO entra
  # nesta rodada (decisão do produto R9-4, 2026-09-30 — T-279).
  - ID: B5.A02V
    bloco: 5
    enunciado: Em qual vínculo esta dívida é descontada?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes: []
    VARIAVEL_GRAVADA: VINCULO_DA_DIVIDA
    condicao_exibicao: {tipo: IGUAL, variavel: TIPO_DIVIDA, valor: CONSIGNADO}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes:
      fonte: ITENS_DO_ESCOPO
      campo_do_snapshot: null
      escopo: VINCULO_ID
      variavel_rotulo: ORGAO_FONTE_PAGADORA
    admite_nao_sei: false
    salto_consequencia: >-
      SYS: a dívida consignada aponta o VINCULO_ID em que é descontada;
      opções = vínculos ativos do caso.

  - ID: B5.A03
    bloco: 5
    enunciado: Para que essa dívida foi originalmente feita?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Pagar despesas do mês, valor_interno: PAGAR_DESPESAS_DO_MES}
      - {rotulo: Emergência ou imprevisto, valor_interno: EMERGENCIA_OU_IMPREVISTO}
      - {rotulo: Saúde, valor_interno: SAUDE}
      - {rotulo: Moradia, valor_interno: MORADIA}
      - {rotulo: Veículo, valor_interno: VEICULO}
      - {rotulo: Educação, valor_interno: EDUCACAO}
      - {rotulo: Compra de bem ou serviço, valor_interno: COMPRA_DE_BEM_OU_SERVICO}
      - {rotulo: Reforma, valor_interno: REFORMA}
      - {rotulo: Viagem/lazer, valor_interno: VIAGEM_LAZER}
      - {rotulo: Ajudar outra pessoa, valor_interno: AJUDAR_OUTRA_PESSOA}
      - {rotulo: Quitar ou substituir outra dívida, valor_interno: QUITAR_OU_SUBSTITUIR_OUTRA_DIVIDA}
      - {rotulo: Não lembro, valor_interno: NAO_SEI, admite_nao_sei: true}
      - {rotulo: Outra, valor_interno: OUTRA}
    VARIAVEL_GRAVADA: FINALIDADE_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.A04
    bloco: 5
    enunciado: Qual destas opções descreve melhor esta operação hoje?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Está ativa., valor_interno: ATIVA}
      - {rotulo: Está em acordo ou renegociação., valor_interno: EM_ACORDO}
      - {rotulo: "Está sendo cobrada, mas não possui pagamento regular definido.", valor_interno: COBRANCA_SEM_PAGAMENTO}
      - {rotulo: "Acredito que esteja quitada, mas preciso confirmar.", valor_interno: QUITADA_A_CONFIRMAR}
      - {rotulo: Outra situação., valor_interno: OUTRA}
    VARIAVEL_GRAVADA: STATUS_DIVIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      QUITADA_A_CONFIRMAR → ação de confirmação (Bloco 11); não entra em
      DIVIDA_TOTAL até confirmar.

  - ID: B5.A05
    bloco: 5
    enunciado: >-
      Esta operação nasceu de uma renegociação ou substituição de uma
      dívida anterior?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: ORIGEM_RENEGOCIACAO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Sim → B5.A05A."

  - ID: B5.A05A
    bloco: 5
    enunciado: A dívida anterior ainda continua existindo separadamente?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Não. Esta operação substituiu a anterior., valor_interno: SUBSTITUIDA}
      - {rotulo: Sim. Ainda existe algum saldo ou obrigação separado., valor_interno: SUBSISTE}
      - {rotulo: Não sei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: DIVIDA_ANTERIOR_SUBSISTE
    condicao_exibicao: {tipo: IGUAL, variavel: ORIGEM_RENEGOCIACAO, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      SUBSTITUIDA → não cadastrar a antiga como ativa. SUBSISTE → cadastrar
      o resíduo como dívida própria. Não contar antiga e nova
      simultaneamente como ativas quando houve substituição integral.

  # Grupo B — Valores e saldo
  - ID: B5.B01
    bloco: 5
    enunciado: >-
      Você sabe quanto foi originalmente contratado ou devido nessa
      operação?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "Sim.", valor_interno: CONFIRMADA}
      - {rotulo: Aproximadamente., valor_interno: ESTIMADA}
      - {rotulo: "Não.", valor_interno: DESCONHECIDA, admite_nao_sei: true}
    VARIAVEL_GRAVADA: QUALIDADE_VALOR_ORIGINAL
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Sim/Aproximadamente → campo R$ → VALOR_ORIGINAL."

  - ID: B5.B02
    bloco: 5
    enunciado: >-
      Você sabe aproximadamente quanto já pagou nessa operação desde o
      início?
    tipo: MOEDA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Tenho apenas uma estimativa., valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: VALOR_JA_PAGO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Não entra no custo comparável (valor passado)."

  - ID: B5.B03
    bloco: 5
    enunciado: Qual é o saldo devedor atual desta dívida?
    tipo: MOEDA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: SALDO_DEVEDOR_ATUAL
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      DESCONHECIDA → PRIORIDADE DE INFORMAÇÃO; STATUS_DIVIDA_TOTAL =
      PARCIAL.

  - ID: B5.B04
    bloco: 5
    enunciado: De quando é essa informação?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Data (dd/mm/aaaa), valor_interno: DATA_DD_MM_AAAA, abre_campo: DATA}
      - {rotulo: Este mês, valor_interno: ESTE_MES}
      - {rotulo: Mês passado, valor_interno: MES_PASSADO}
      - {rotulo: Há mais tempo, valor_interno: HA_MAIS_TEMPO}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: DATA_REFERENCIA_SALDO
    # AMBIGUIDADE DA CANÔNICA (reportada em T-17): a condição normativa é
    # "B5.B03 ≠ Não sei", mas B5.B03 é MOEDA com admite_nao_sei — o valor
    # gravado para a resposta "Não sei" não é uma string comparável por
    # CondicaoIgual (é o sentinel NAO_SEI, tratado à parte pelo motor de
    # respostas). O esquema de Condicao (collection/condicoes.py) não tem um
    # nó "variável respondida com sentinel NAO_SEI" — só IGUAL/CONTEM contra
    # string concreta. Sem um nó adicional (fora do escopo desta tarefa, que
    # é transcrição), a condição mais fiel possível é "sempre exibida",
    # deixando ao app a checagem de NAO_SEI na hora de exibir.
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.B05
    bloco: 5
    enunciado: >-
      Você já consultou quanto precisaria pagar hoje para quitar
      integralmente esta dívida?
    tipo: SELECAO_UNICA
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "Sim.", valor_interno: SIM}
      - {rotulo: "Não.", valor_interno: NAO}
      - {rotulo: "Consultei, mas o valor já venceu/expirou.", valor_interno: EXPIROU}
      - {rotulo: Não sei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: QUITACAO_CONSULTADA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      SIM → B5.B05A e B5.B05B. EXPIROU → B5.B05A como histórico
      (STATUS_VALIDADE_PROPOSTA = EXPIRADA). NAO → ação de consulta (Bloco
      11).

  - ID: B5.B05A
    bloco: 5
    enunciado: Qual foi o valor informado para quitar a dívida?
    tipo: MOEDA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: VALOR_QUITACAO_HOJE
    condicao_exibicao:
      tipo: OU
      termos:
        - {tipo: IGUAL, variavel: QUITACAO_CONSULTADA, valor: SIM}
        - {tipo: IGUAL, variavel: QUITACAO_CONSULTADA, valor: EXPIROU}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Saldo devedor ≠ valor de quitação."

  - ID: B5.B05B
    bloco: 5
    enunciado: Até quando esse valor é válido?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Data, valor_interno: null, abre_campo: DATA}
      - {rotulo: Validade não informada., valor_interno: VALIDADE_DESCONHECIDA}
      - {rotulo: Não sei., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: DATA_VALIDADE_PROPOSTA
    condicao_exibicao: {tipo: IGUAL, variavel: QUITACAO_CONSULTADA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Validade desconhecida e material → PRIORIDADE DE INFORMAÇÃO.

  # Grupo C — Fluxo
  - ID: B5.C01
    bloco: 5
    enunciado: >-
      Esta dívida possui uma parcela ou prestação mensal definida
      atualmente?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: POSSUI_PARCELA_DEFINIDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Sim → B5.C02–C04 (Modelo 1). Não/Não sei → B5.C05 (Modelo 2).

  - ID: B5.C02
    bloco: 5
    enunciado: Qual é o valor da parcela ou prestação que deveria ser paga atualmente?
    tipo: MOEDA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: "PARCELA_CONTRATUAL (= PAGAMENTO_MENSAL_DEVIDO_VIGENTE)"
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_PARCELA_DEFINIDA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.C03
    bloco: 5
    enunciado: Quantas parcelas ainda faltam?
    tipo: NUMERO
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: ___ parcelas, valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: PARCELAS_RESTANTES
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_PARCELA_DEFINIDA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.C04
    bloco: 5
    enunciado: Você sabe quando essa operação termina se seguir normalmente até o fim?
    tipo: DATA
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Mês/ano, valor_interno: null}
      - {rotulo: Não sei., valor_interno: null, admite_nao_sei: true}
    VARIAVEL_GRAVADA: DATA_TERMINO_CONTRATUAL
    condicao_exibicao: {tipo: IGUAL, variavel: POSSUI_PARCELA_DEFINIDA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: null

  - ID: B5.C05
    bloco: 5
    enunciado: Existe algum pagamento mínimo ou valor mensal formalmente exigido hoje?
    tipo: SIM_NAO_TALVEZ
    obrigatoriedade: [COND, REP]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: POSSUI_PAGAMENTO_MINIMO
    condicao_exibicao:
      tipo: NAO
      termo: {tipo: IGUAL, variavel: POSSUI_PARCELA_DEFINIDA, valor: SIM}
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Sim → B5.C05A. Não/Não sei e B5.C06 = Não sei → cronograma definitivo
      desta dívida bloqueado (Matriz, Bloco 5 Grupo C).

  - ID: B5.C05A
    bloco: 5
