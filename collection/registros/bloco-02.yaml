      - {rotulo: Não. Prefiro manter esses gastos., valor_interno: NAO}
    VARIAVEL_GRAVADA: ACEITA_REDUCAO_GASTOS_FANTASMAS
    condicao_exibicao:
      tipo: IGUAL
      variavel: GASTOS_FANTASMAS
      valor: SIM
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      Somente SIM torna VALOR_GASTOS_FANTASMAS elegível à economia
