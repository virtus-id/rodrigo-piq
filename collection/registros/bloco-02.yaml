    VARIAVEL_GRAVADA: VALOR_GASTOS_FANTASMAS
    condicao_exibicao:
      tipo: IGUAL
      variavel: GASTOS_FANTASMAS
      valor: SIM
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
