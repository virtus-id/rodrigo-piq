# Bloco 8 — Troca e portabilidade (§11 da spec canônica, `specs/piq-app-spec.md`).
#
# Escopo desta tarefa (T-18): apenas `B8.01` a `B8.15`. `B8.00` (proposta de
# troca), `B8.P01`/`B8.P02` (cascata) e `B8.EX01`/`B8.EX02` (conclusão da
# troca / encerramento da antiga) NÃO fazem parte do escopo declarado na
# tarefa e ficam para transcrição futura.
#
# Todas as perguntas deste bloco pertencem à ficha de dívida (`DIVIDA_ID`,
# RF-17): o motor sinaliza em `ORDEM_ACOES` quais dívidas são candidatas a
# troca, e a interface nunca decide isso sozinha. A condição de exibição
# textual "B8.00 = Sim" da canônica é modelada como `IGUAL` sobre
# `STATUS_TROCA`, com o valor interno correspondente a "Sim" na tabela de
# mapeamento de B8.00 (PROPOSTA_RECEBIDA).

