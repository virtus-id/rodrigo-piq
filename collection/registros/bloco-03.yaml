  - ID: B3.01
    bloco: 3
    enunciado: >-
      Quanto você recebe líquidos, em média, por mês na sua principal fonte
      de renda?
    tipo: MOEDA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "R$ ______", valor_interno: null}
      - rotulo: >-
          Minha renda é variável e não consigo representá-la por um único
          valor.
        valor_interno: null
    VARIAVEL_GRAVADA: RENDA_PRINCIPAL
    indispensavel: true  # RF-93 (`T-261`, `R9-8`)
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: >-
      "Renda variável sem valor único" → RENDA_PRINCIPAL = DESCONHECIDA e
      B3.02 deve ser Variável.

  - ID: B3.02
    bloco: 3
    enunciado: Qual destas opções descreve melhor a sua principal renda?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - rotulo: >-
          Fixa — recebo praticamente o mesmo valor líquido todos os meses.
        valor_interno: FIXA
      - rotulo: >-
          Relativamente estável — o valor varia, mas normalmente dentro de
          uma faixa pequena.
        valor_interno: RELATIVAMENTE_ESTAVEL
      - rotulo: >-
          Variável — o valor pode mudar bastante de um mês para outro.
        valor_interno: VARIAVEL
    VARIAVEL_GRAVADA: TIPO_RENDA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: "VARIAVEL → abre B3.02A e B3.02B."

