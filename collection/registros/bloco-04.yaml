    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: Sim, valor_interno: SIM}
      - {rotulo: Não, valor_interno: NAO}
      - {rotulo: Não sei ao certo, valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: DINHEIRO_DISPONIVEL_EXISTE
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: "Sim → B4.01A."

