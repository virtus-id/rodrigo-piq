# Bloco 7 — Renegociação (§11 da spec canônica, `specs/piq-app-spec.md`).
#
# Escopo desta tarefa (T-18): apenas `B7.05` a `B7.16` — o trecho da proposta
# de renegociação em si, reaberto integralmente por `RESULTADO_ACAO_RENEGOCIACAO
# = Sim` (B11.03-REN, RF-27). `B7.01`–`B7.04` (tentativa anterior/proposta
# concreta) e `B7.S01`/`B7.EX01`–`B7.EX03` (seguro na proposta / execução) NÃO
# fazem parte do escopo declarado na tarefa e ficam para transcrição futura.
#
# Todas as perguntas deste bloco pertencem à ficha de dívida (`DIVIDA_ID`,
# RF-17): o motor sinaliza em `ORDEM_ACOES` quais dívidas são candidatas a
# renegociação, e a interface nunca decide isso sozinha. A condição de
# exibição textual "B7.04 = VIGENTE, VALIDADE_DESCONHECIDA ou EXPIRADA" da
# canônica é modelada como `OU` dos três valores de `EXISTE_PROPOSTA_
# RENEGOCIACAO` citados literalmente (a variável é seleção única de B7.04,
# não checklist).

