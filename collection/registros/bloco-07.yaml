# Bloco 7 — Renegociação (§11 da spec canônica, `specs/piq-app-spec.md`).
#
# Escopo desta tarefa (T-18): `B7.05` a `B7.16` — o trecho da proposta de
# renegociação em si, reaberto integralmente por `RESULTADO_ACAO_RENEGOCIACAO
# = Sim` (B11.03-REN, RF-27). v1.0.3 (T-242, `E-15`, `DE-07`): `B7.04`
# (proposta concreta, que todas as condições abaixo leem) é transcrito, e
# nascem `B7.04A` (tipo da proposta) e `B7.07V` (valor à vista); as
# condições passam a depender do tipo (decisão do produto `R9-3`: à vista
# mostra valor, validade, desconto e fonte). `B7.01`–`B7.03` e
# `B7.S01`/`B7.EX01`–`B7.EX03` continuam para transcrição futura.
#
# Todas as perguntas deste bloco pertencem à ficha de dívida (`DIVIDA_ID`,
# RF-17): o motor sinaliza em `ORDEM_ACOES` quais dívidas são candidatas a
# renegociação, e a interface nunca decide isso sozinha. A condição de
# exibição textual "B7.04 = VIGENTE, VALIDADE_DESCONHECIDA ou EXPIRADA" da
# canônica é modelada como `OU` dos três valores de `EXISTE_PROPOSTA_
# RENEGOCIACAO` citados literalmente (a variável é seleção única de B7.04,
# não checklist).

QUESTIONARIO_VERSION: "1.0.3"

perguntas:
  - ID: B7.04
    bloco: 7
    enunciado: >-
      Você possui hoje uma proposta concreta do credor para renegociar ou
      quitar esta dívida?
    tipo: SELECAO_UNICA
    obrigatoriedade: [COND]
    escopo_repeticao: DIVIDA_ID
    opcoes:
      - { rotulo: "Sim, e a proposta ainda está válida.", valor_interno: VIGENTE }
      - { rotulo: "Sim, mas não sei se ainda está válida.", valor_interno: VALIDADE_DESCONHECIDA }
      - { rotulo: "Recebi uma proposta, mas ela já expirou.", valor_interno: EXPIRADA }
      - { rotulo: "Não tenho uma proposta atualmente.", valor_interno: NAO }
    VARIAVEL_GRAVADA: EXISTE_PROPOSTA_RENEGOCIACAO
    # "Dívida qualificada para B7": quem qualifica é a coleta dirigida pelo
    # motor (`app/casos/coleta_dirigida.py`), nunca uma condição aqui.
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: { fonte: REGISTRO, campo_do_snapshot: null }
    admite_nao_sei: false
    salto_consequencia: >-
      NAO → STATUS_PROCESSO_RENEGOCIACAO = AGUARDANDO_PROPOSTA; gera ação; não
      pedir condições hipotéticas. VIGENTE/VALIDADE_DESCONHECIDA → B7.04A e
      B7.05–B7.16. EXPIRADA → idem, como histórico (não determina decisão).

