# Bloco 9 — Comportamento e método. Transcrição PARCIAL, restrita a `B9.02` e
# `B9.04`, caractere por caractere da §11 da canônica (specs/piq-app-spec.md,
# linhas 4129-4200). T-99 (RF-14, AC-13).
#
# ATENÇÃO: o Bloco 9 tem 6 perguntas na canônica (`B9.01`..`B9.05`), mas só
# duas alimentam o contrato do motor hoje — `SinaisComportamentais.
# NECESSIDADE_VITORIA` (`B9.02`) e `SinaisComportamentais.HISTORICO_ABANDONO`
# (`B9.04`), lacuna descoberta em T-50. As outras quatro (`B9.01`
# TOLERANCIA_ESPERA, `B9.03` DISCIPLINA_EXECUCAO, `B9.04A` MOTIVO_ABANDONO,
# `B9.05` PREFERENCIA_METODO) não têm campo correspondente em
# `EstadoFinanceiro`/`Divida`/`PerfilComportamental`/`SinaisComportamentais`
# hoje e ficam de fora desta transcrição — mesmo critério de recorte já
# aplicado por T-19 ao Bloco 12 (só o que alimenta o contrato do motor entra).
QUESTIONARIO_VERSION: "1.0.0"
perguntas:
  - ID: B9.02
    bloco: 9
    enunciado: >-
      De 0 a 10, quanto eliminar uma dívida relativamente cedo aumentaria sua
      confiança para continuar executando o plano?
    tipo: ESCALA_0_10
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "0 = Isso faria pouca diferença para mim.", valor_interno: "0"}
      - {rotulo: "10 = Uma primeira quitação rápida faria muita diferença para eu continuar.", valor_interno: "10"}
    VARIAVEL_GRAVADA: NECESSIDADE_VITORIA
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: false
    salto_consequencia: null

  - ID: B9.04
    bloco: 9
    enunciado: >-
      Nos últimos dois anos, você começou algum plano para organizar as
      finanças, quitar dívidas, economizar ou investir e depois abandonou
      antes de alcançar o objetivo?
    tipo: SELECAO_UNICA
    obrigatoriedade: [OBR]
    escopo_repeticao: NENHUM
    opcoes:
      - {rotulo: "Sim, isso aconteceu mais de uma vez.", valor_interno: MAIS_DE_UMA}
      - {rotulo: "Sim, aconteceu uma vez.", valor_interno: UMA}
      - {rotulo: "Não.", valor_interno: NAO}
      - {rotulo: Não comecei nenhum plano desse tipo nesse período., valor_interno: SEM_PLANO}
      - {rotulo: Não lembro / não sei avaliar., valor_interno: NAO_SEI, admite_nao_sei: true}
    VARIAVEL_GRAVADA: HISTORICO_ABANDONO
    condicao_exibicao: null
    interpolacoes: []
    validacoes_cruzadas: []
    origem_opcoes: {fonte: REGISTRO, campo_do_snapshot: null}
    admite_nao_sei: true
    salto_consequencia: >-
      Sim → B9.04A (fora do escopo desta transcrição — B9.04A não tem campo
      correspondente em SinaisComportamentais hoje). HISTORICO_ABANDONO =
      SIM para A ou B.
